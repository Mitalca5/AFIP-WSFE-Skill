[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-afip-wsfe"
version = "0.1.0"
description = "Sanitized AFIP/ARCA WSAA and WSFEv1 electronic invoicing helpers for Codex skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open AFIP WSFE contributors" }]
dependencies = []

[project.optional-dependencies]
soap = ["requests>=2.31", "lxml>=4.9", "zeep>=4.2"]

[tool.setuptools.packages.find]
where = ["src"]

